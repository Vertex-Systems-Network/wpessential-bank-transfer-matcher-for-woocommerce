services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wbm_test
      MARIADB_USER: wbm_test
      MARIADB_PASSWORD: wbm-test-db-only
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database:/var/lib/mysql

  wordpress:
    image: wordpress:7.0-php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wbm_test
      WORDPRESS_DB_USER: wbm_test
      WORDPRESS_DB_PASSWORD: wbm-test-db-only
      WORDPRESS_DEBUG: "1"
    ports:
      - "127.0.0.1:8891:80"
    volumes:
      - wordpress:/var/www/html

volumes:
  database:
  wordpress:
