name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, phpstan:2.1.32
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify task graph and requirement references
        run: python3 scripts/check-project-state.py
      - name: Verify generated documentation
        run: |
          npm run docs:check
          npm run docs:readme-validate
          python3 tests/docs_generation.py
          python3 tests/marketplace_evidence.py
      - name: Validate and build independent Composer packages
        run: |
          bash scripts/package-plugin.sh free
          bash scripts/package-plugin.sh pro
      - name: P9 independent ZIP licenses, optimized autoload and deterministic repeat
        run: |
          python3 -m py_compile scripts/verify-release-archives.py tests/p9_archive_guards.py
          python3 scripts/verify-release-archives.py --output dist/p9-license-inventory.json
          PYTHONOPTIMIZE=1 python3 tests/p9_archive_guards.py
          PYTHONOPTIMIZE=1 python3 scripts/verify-release-archives.py
          sha256sum dist/wpessential-bank-transfer-matcher.zip dist/wpessential-bank-transfer-matcher-pro.zip > /tmp/wbm-package-first.sha256
          bash scripts/package-plugin.sh free
          bash scripts/package-plugin.sh pro
          sha256sum dist/wpessential-bank-transfer-matcher.zip dist/wpessential-bank-transfer-matcher-pro.zip > /tmp/wbm-package-second.sha256
          cmp /tmp/wbm-package-first.sha256 /tmp/wbm-package-second.sha256
          python3 scripts/verify-release-archives.py
      - name: Upload verified Free and Pro candidate ZIPs and factual license inventory
        uses: actions/upload-artifact@v4
        with:
          name: p9-independent-free-pro-zip-candidates
          path: |
            dist/wpessential-bank-transfer-matcher.zip
            dist/wpessential-bank-transfer-matcher-pro.zip
            dist/p9-license-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Check finance dialog JavaScript syntax
        run: |
          node --check plugins/wpessential-bank-transfer-matcher-pro/assets/js/finance-dialogs.js
          node --check tests/browser/p8-private-http.mjs
          node --check tests/browser/p8-csrf-http.mjs
          node --check tests/browser/p8-real-checkout-http.mjs
      - name: Check PHP syntax
        run: find plugins playground/tests tests -name vendor -prune -o -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Analyze reconciliation domain types
        run: phpstan analyse --no-progress
      - name: Run PHP unit checks
        run: |
          php tests/money.php
          php tests/domain.php
          php tests/transaction-identity.php
          php tests/matching-eligibility.php
          php tests/deterministic-matcher.php
          php tests/allocation-balance.php
          php tests/partial-credit-plan.php
          php tests/split-credit-plan.php
          php tests/overpayment-review.php
          php tests/mismatch-review.php
          php tests/payment-readiness.php
          php tests/report-definitions.php
          php tests/report-csv.php
          php tests/finance-notification-templates.php
          php tests/finance-operations-redacted-csv.php
          php tests/finance-retention-policy.php
          php tests/pro-operations-docs.php
          php tests/p7-screen-contracts.php
          php tests/p7-native-ui-asset-scope.php
          php tests/p7-real-action-route-contracts.php
          php tests/secondary-hints.php
          php tests/conflict-cases.php
          php tests/camt053.php
          php tests/migrations.php
      - name: Package and test in Playground
        run: |
          python3 tests/playground_download_retry.py
          python3 scripts/build_playground_bundles.py
          python3 scripts/test-playground-foundation.py
          python3 scripts/verify-playground-release-bundles.py --negative-tests
      - name: Upload exact-source base/Free/Pro Playground release evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-playground-bundles
          path: |
            dist/playground-base.zip
            dist/playground-free.zip
            dist/playground-pro.zip
            dist/p9-playground-bundle-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate P9 release SHA256SUMS, canonical changelog and historical compatibility report
        env:
          WBM_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m py_compile scripts/generate-p9-release-evidence.py
          python3 scripts/generate-p9-release-evidence.py --negative-tests
      - name: Upload P9 source-verified release validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: p9-sha256-changelog-compat-validation
          path: |
            dist/SHA256SUMS
            dist/CHANGELOG-0.1.0.md
            dist/p9-validation-report.json
            dist/p9-compatibility-matrix.json
          if-no-files-found: error
          retention-days: 14

  mariadb-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wbm_ci
          MARIADB_USER: wbm_ci
          MARIADB_PASSWORD: wbm-ci-test-only
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: composer:v2, wp-cli
      - name: Verify or bootstrap checksum-pinned WP-CLI for real MariaDB tests
        run: bash scripts/ensure-wp-cli-ci.sh
      - name: Install Free runtime autoloader
        run: composer --working-dir=plugins/wpessential-bank-transfer-matcher install --no-dev --no-interaction
      - name: Exercise migrations against WordPress and MariaDB
        env:
          WBM_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: |
          wp_path="$RUNNER_TEMP/wbm-wordpress"
          wp core download --path="$wp_path" --version=7.0.8
          wp config create --path="$wp_path" --dbname=wbm_ci --dbuser=wbm_ci --dbpass=wbm-ci-test-only --dbhost="127.0.0.1:$WBM_DB_PORT"
          wp core install --path="$wp_path" --url=http://wbm.test --title="Matcher CI" --admin_user=wbm_ci --admin_email=ci@example.test --skip-email
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/migrations.php" --path="$wp_path"
      - name: Verify native plugin installs and WooCommerce order storage
        run: |
          bash scripts/package-plugin.sh free
          bash scripts/package-plugin.sh pro
          bash scripts/test-native-install.sh "$RUNNER_TEMP/wbm-wordpress"
