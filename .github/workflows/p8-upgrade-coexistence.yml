name: P8 in-place WC upgrade and third-party coexistence

on:
  push:
    branches:
      - development/p8-threat-model-access-matrix-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-upgrade:
    name: "Free/Pro Woo 10.8 to 11.3 upgrade - ${{ matrix.storage }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        storage: ['classic', 'hpos']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wbm_ci
          MARIADB_USER: wbm_ci
          MARIADB_PASSWORD: wbm-ci-test-only
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      P8_UPGRADE_STORAGE_MODE: ${{ matrix.storage }}
      P8_UPGRADE_FIXTURE_FILE: /tmp/p8-upgrade-fixture.json
      P8_UPGRADE_REPORT_FILE: /tmp/p8-upgrade-verification.json
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, dom, fileinfo
          tools: composer:v2, wp-cli
      - name: Verify pinned WP-CLI and build exact Free and Pro ZIPs
        run: |
          set -euo pipefail
          bash scripts/ensure-wp-cli-ci.sh
          php -l tests/integration/p8-upgrade-coexistence.php
          bash scripts/package-plugin.sh free
          bash scripts/package-plugin.sh pro
      - name: Install disposable WP WC 10.8 Free/Pro and third-party coexistence fixture
        env:
          WBM_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/p8-upgrade-wp"
          echo "P8_UPGRADE_WP_PATH=$site" >> "$GITHUB_ENV"
          wp core download --path="$site" --version=7.0.8
          wp config create --path="$site" --dbname=wbm_ci --dbuser=wbm_ci \
            --dbpass=wbm-ci-test-only --dbhost="127.0.0.1:$WBM_DB_PORT"
          wp core install --path="$site" --url=http://p8-upgrade.test \
            --title="P8 synthetic in-place upgrade" --admin_user=wbm_ci \
            --admin_email=p8-upgrade@example.test --skip-email
          wp plugin install https://downloads.wordpress.org/plugin/woocommerce.10.8.0.zip \
            --activate --path="$site"
          # Real WordPress plugin dependency resolver: Pro cannot activate
          # before required Free, yet must later load with it.
          wp plugin install "$GITHUB_WORKSPACE/dist/wpessential-bank-transfer-matcher-pro.zip" \
            --path="$site"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/order-storage.php" \
            pro-missing-free --path="$site"
          wp plugin install "$GITHUB_WORKSPACE/dist/wpessential-bank-transfer-matcher.zip" \
            --activate --path="$site"
          wp plugin activate wpessential-bank-transfer-matcher-pro --path="$site"
          wp option update woocommerce_custom_orders_table_data_sync_enabled no --path="$site"
          if [[ "$P8_UPGRADE_STORAGE_MODE" == hpos ]]; then
            wp option update woocommerce_custom_orders_table_enabled yes --path="$site"
          else
            wp option update woocommerce_custom_orders_table_enabled no --path="$site"
          fi
          # A separate, harmless CI companion plugin implements the kind of
          # custom order-number filter a real merchant could be running.
          # It is generated inside disposable WordPress only, not packaged.
          mkdir -p "$site/wp-content/plugins/p8-ci-order-number"
          cat > "$site/wp-content/plugins/p8-ci-order-number/p8-ci-order-number.php" <<'PHP'
          <?php
          /*
           * Plugin Name: P8 CI Synthetic Order Number Companion
           * Version: 0.0.1
           * Requires PHP: 8.3
           */
          defined('ABSPATH') || exit;
          add_action('init', static function (): void {
              do_action('p8_ci_companion_ready');
          }, 99);
          add_filter('woocommerce_order_number',
              static fn($number, $order): string => 'EXT-' . (string)$number, 10, 2);
          PHP
          wp plugin activate p8-ci-order-number --path="$site"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/order-storage.php" \
            paired --path="$site"
          test "$(wp eval 'echo WC_VERSION;' --path="$site")" = 10.8.0
      - name: Seed single real unpaid WooCommerce order and safe bank/claim evidence
        run: |
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/p8-upgrade-coexistence.php" \
            seed --path="$P8_UPGRADE_WP_PATH"
      - name: Pro deactivation must not break Free, reference, or companion
        run: |
          set -euo pipefail
          wp plugin deactivate wpessential-bank-transfer-matcher-pro \
            --path="$P8_UPGRADE_WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/p8-upgrade-coexistence.php" \
            free-only --path="$P8_UPGRADE_WP_PATH"
          wp plugin activate wpessential-bank-transfer-matcher-pro \
            --path="$P8_UPGRADE_WP_PATH"
      - name: Upgrade WC in place then replace both Free/Pro ZIP packages
        run: |
          set -euo pipefail
          site="$P8_UPGRADE_WP_PATH"
          wp plugin install https://downloads.wordpress.org/plugin/woocommerce.11.3.0.zip \
            --force --activate --path="$site"
          test "$(wp eval 'echo WC_VERSION;' --path="$site")" = 11.3.0
          wp plugin install "$GITHUB_WORKSPACE/dist/wpessential-bank-transfer-matcher.zip" \
            --force --activate --path="$site"
          wp plugin install "$GITHUB_WORKSPACE/dist/wpessential-bank-transfer-matcher-pro.zip" \
            --force --activate --path="$site"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/order-storage.php" \
            paired --path="$site"
      - name: Verify exact same real unpaid order, immutable ref/claim and Pro metadata
        run: |
          set -euo pipefail
          site="$P8_UPGRADE_WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/p8-upgrade-coexistence.php" \
            verify --path="$site"
          # A second independent process must still see identical persisted
          # migration version and evidence (no duplicate rows after restart).
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/p8-upgrade-coexistence.php" \
            verify --path="$site"
          python3 - <<'PY'
          import json, os
          path=os.environ['P8_UPGRADE_REPORT_FILE']
          d=json.load(open(path,encoding='utf-8'))
          assert d['synthetic'] and d['initial_woocommerce']=='10.8.0'
          assert d['upgraded_woocommerce']=='11.3.0'
          assert d['companion_active'] and d['free_active'] and d['pro_active']
          assert d['free_reference_unchanged'] and d['unverified_claim_unchanged']
          assert d['safe_pro_bank_account_unchanged']
          assert not d['paid_state_changed'] and not d['duplicate_evidence_rows']
          print('PASS P8-T008 persisted harmless companion + Free/Pro + BACS evidence through real Woo in-place upgrade and ZIP reinstalls')
          PY
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/p8-upgrade-coexistence.php" \
            cleanup --path="$site"
      - name: Archive synthetic upgrade evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-wc-upgrade-${{ matrix.storage }}-evidence
          path: /tmp/p8-upgrade-verification.json
          if-no-files-found: warn
          retention-days: 30
